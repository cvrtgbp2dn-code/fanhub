  }

  // ---------- 选中集合辅助 ----------
  // 可勾选 / 可批量操作的行统一由 cardPickable(dev) / viewPickable() 提供（见上方「作用域」那一段）。
  // ⚠️ 原来的 groupPickableRows(dev) 已删除 —— 它不认识「群组作用域」，留着只会有人误用。
  // 搜索匹配（模块级，供 render 共用，避免条件写歪）
  // 筛选 + 精准搜索。选择框即时生效；搜索为「精准」= 与 数据ID/昵称/群名称 完全相等（忽略大小写与首尾空格）。
  function matchFilters(r) {
    if (selDevice && r.device !== selDevice) return false;
    if (selTag === 'outlib') { if (!outOfLib(r)) return false; }
    else if (selTag && r.status !== selTag) return false;
    if (searchQ) {
      var q = searchQ;
      var hit = (String(r.id || '').trim().toLowerCase() === q) ||
                (String(r.nick || '').trim().toLowerCase() === q) ||
                (String(r.group || '').trim().toLowerCase() === q);
      if (!hit) return false;
    }
    return true;
  }
  // 该设备「当前可见」的已完成行 —— 口径与界面上「已完成（N）」的 N 完全一致
  // ⚠️ 已随作用域改造删除 doneRowsOfDev(dev)：它会无视「群组视图」把整台设备的已完成的都算进来。
  //    两个删除入口（表头「删除选中」/ 已完成区的垃圾桶）现在都走 viewRows() 显式收窄。
  // ---------- 「当前视图」的行 + 作用域（2026-10-12 群组总览引入）----------
  //   groupScope 非空 → 当前视图 = 该群在**所有设备**上的数据，按侧栏设备顺序排
  //   groupScope 为空 → 当前视图 = filterDevice 这一台设备
  // 操作栏的「修改类型」那一串动作（设置群名称 / 设为未分配 / 设为已拉群 / 设为已分配 / 设为已完成）都作用在这个范围上。
  function viewRows() {
    if (!groupScope) return rows.filter(function (r) { return r.device === filterDevice; });
    var idx = {};
    deviceOrder.forEach(function (d, i) { idx[d] = i; });
    // ⚠️ sort 稳定 → 同一台设备内部保持导入顺序（不用再排第二次）
    return rows.filter(function (r) { return r.group === groupScope; }).sort(function (a, b) {
      var ia = (a.device in idx) ? idx[a.device] : 1e9;
      var ib = (b.device in idx) ? idx[b.device] : 1e9;
      return ia - ib;
    });
  }
  // 当前视图里「可操作」的行（未完成 且 不在库外）
  function viewPickable() {
    return viewRows().filter(function (r) { return r.status !== 'done' && !outOfLib(r); });
  }
  // 某台设备在当前作用域下的可操作行（群组视图时会自动收窄到该群）
  function cardPickable(dev) {
    // ⚠️ 群组视图那张表把作用域键设成 GRP_KEY —— 它的「可操作行」就是整个群的可操作行
    if (dev === GRP_KEY) return viewPickable();
    return viewPickable().filter(function (r) { return r.device === dev; });
  }
  // 「数据类型」下拉的五个候选（数组顺序 = 下拉里的顺序）
  // ⚠️ 2026-10-13 牛牛要求：第一项由「全选」**改名「默认」**（它本来就是默认选中的那一项）
  // ⚠️ 2026-10-14 牛牛要求：**按当前作用域动态显示** —— 当前这台设备 / 这个群里没有的那一类，
  //    就不再出现在下拉里（更清爽）。「全选」永远在（它是基础档）。
  //    判定口径和 typePool() 完全一致（都在当前作用域里算），所以"下拉里有的，点进去一定有"。
  // ⚠️ 2026-10-15 牛牛改口：第一项由「默认」**又改回「全选」**（2026-10-13 曾由「全选」改成「默认」）。
  //    因为"还没选过"这层意思现在由**按钮上的占位「选择类型」**承担了，所以列表里可以叫它本来的名字。
  var PICK_TYPES = [
    { v: 'all', label: '全选' },
    { v: 'none', label: '未分配' },
    { v: 'pending', label: '已分配' },
    { v: 'launched', label: '已拉群' },
    { v: 'done', label: '已完成' }
  ];
  function typeLabel(v) {
    for (var i = 0; i < PICK_TYPES.length; i++) if (PICK_TYPES[i].v === v) return PICK_TYPES[i].label;
    return '全选';
  }
  // 当前实际可用的下拉项：「默认」常驻，其余四类"有数据才出现"。
  function pickTypes() {
    var out = [PICK_TYPES[0]];
    for (var i = 1; i < PICK_TYPES.length; i++) {
      if (typePool(PICK_TYPES[i].v).length) out.push(PICK_TYPES[i]);

  }
  // 当前选中的那一类被"用没了"（比如把最后几条「已拉群」都退回「已分配」）→ 悄悄退回「默认」。
  // ⚠️ 只改 pickType，**绝不顺手 autoSelectAll** —— 否则一次批量操作之后勾选会突然变成"全部未完成"，
  //    紧接着再点「修改类型」就会作用到一大片，太危险。勾选保持操作完的原样即可。
  // ⚠️ 必须在 render() 拼 HTML 之前跑（下拉要按定稿后的 pickType 渲染）。
  function normalizePickType() {
    if (pickType === 'all') return;
    var list = pickTypes();
    for (var i = 0; i < list.length; i++) if (list[i].v === pickType) return;
    pickType = 'all';
  }
  // 当前「数据类型」对应的候选池（保持视图里的原始顺序，「自下而上」在 typePick 里切）。
  //   · 'all' / 'none' / 'pending' / 'launched' → 走 viewPickable()（已排除「已完成」和「不在库」）
  //   · 'done' → 当前作用域下的「已完成」行（它们默认藏在表格的折叠区里）
  function typePool(v) {
    if (v === 'done') return viewRows().filter(function (r) { return r.status === 'done'; });
    var base = viewPickable();
    if (v === 'all') return base;
    return base.filter(function (r) { return r.status === v; });
  }
  // 「按上传批次倒序」= **未完成区的显示顺序**（稳定排序 ⇒ 同批次内部保持原顺序）。
  //   ⚠️⚠️ 表格和「选中 N」**必须共用这一个函数** —— 否则显示一套顺序、选中另一套，
  //       勾出来就会"中间空一片"（2026-10-14 牛牛实拍到的 bug：看着是断开的几段，不是连续一条带）。
  function sortByBatchDesc(list) {
    return list.slice().sort(function (a, b) { return (b.batch || 0) - (a.batch || 0); });
  }
  // 某个「数据类型」对应的候选池，**按它在表格里的实际显示顺序**排好。
  //   · 未完成那几档 → 按上传批次倒序（和 tableCard 里那行用的是同一个函数）
  //   · 'done' 档     → 走 sortDoneRows（和已完成折叠区里那行用的是同一个函数）
  function typePoolInDisplayOrder(v) {
    return (v === 'done') ? sortDoneRows(typePool(v)) : sortByBatchDesc(typePool(v));
  }
  // 自下而上取最多 n 条（不足 n 则全取）。
  // ⚠️ 2026-10-14 定稿：**按表格的显示顺序，从最下面往上数 n 条** ——
  //    未完成区按上传批次倒序（最旧的在最下），所以取到的是**最旧的 n 条**，
  //    而且一定是**连续一段**，中间不会有空洞（这是和"按导入顺序取"最大的区别）。
  function typePick(n) {
    var list = typePoolInDisplayOrder(pickType);
    return list.slice(Math.max(0, list.length - n));
  }
  // ---------- 勾选从**空**开始，要选就自己点（2026-10-15 牛牛改口）----------
  // ⚠️ 2026-10-13 曾经是「进数据页就自动全勾上」，2026-10-15 **取消**了：
  //    「数据类型」按钮现在恒显示占位「选择类型」（= 看着像"还没选"），却把整区都勾上 → 自相矛盾。
  //    现在的规则（统一一条）：**进设备 / 点群名进群视图 / 导入完成 / 恢复备份 —— 一律不自动勾**。
  //    · 要全选   → **主动在下拉里点一下「全选」**（onPickType 里会整类全勾，
  //                 且它**没有**"同值就不再触发"的拦截 —— 所以已经是全选时再点一下照样重新全勾）
  //    · 要某几类 → 点那一类（点中即整类全勾）
  //    · 要 N 条   → 「选中 N」填数字点 ✓
  // ⚠️ 于是原来的 autoSelScope / suppressAutoSel / syncAutoSelect 全部作废，已删干净。
  function autoSelectAll() {
    var list = typePool(pickType);
    selected = {};
    list.forEach(function (r) { selected[r.k] = true; });
    return list.length;
  }

  function selCount() { var n = 0; for (var k in selected) if (selected[k]) n++; return n; }
  // 「选中 N」输入框 ↔ 实际勾选数 同步。
  // ⚠️ 鼠标正在这个框里打字时**绝不能回写**，否则刚敲的数字立刻被覆盖（一个字都打不进去）。
  //    这时只切换 .dirty（框里的数 ≠ 实际选中数 → 描蓝，提示"还没按 ✓"）。
  function syncSelNum() {
    var box = $('selNum');
    if (!box) return;
    var cur = String(selCount());
    if (document.activeElement === box) { box.classList.toggle('dirty', String(box.value).trim() !== cur); return; }
    box.value = cur;
    box.classList.remove('dirty');
  }
  // 输入框后面的 ✓（回车同）：按「数据类型」下拉选的那一类，自下而上选中 N 个。
  //   语义是「把选中数设成 N」→ 所以**先清空上次的勾选**，免得和上一批叠加成"选多了"。
  function selNumConfirm() {
    var box = $('selNum'); if (!box) return;
    var n = parseInt(String(box.value).replace(/[^\d]/g, ''), 10);
    if (!n || n < 1) { toast('先填个数字，比如 5'); return; }
    var label = typeLabel(pickType);
    var list = typePick(n);
    if (!list.length) { toast('「' + label + '」里暂时没有数据'); return; }

    box.classList.remove('dirty');

    var needRender = false;

  }
  // 输入框后面的 ✗（Esc 同）：**取消选中 = 把所有勾选全清掉**（牛牛 2026-10-13：「点 ✗ 是清空所有勾选，全清」）。

  function selNumCancel() {
    var box = $('selNum'); if (!box) return;

    selected = {};

    refreshSelectionUI();
    if (box) { box.value = '0'; box.classList.remove('dirty'); }
    if (had) toast('已取消选中 ' + had + ' 条');
    else toast('现在一条都没勾选', null, 'block');
  }
  // 只刷新与选中相关的界面（勾选数 + 行勾选框 + 表头全选框/半选态），不重绘整个列表
  function refreshSelectionUI() {
    syncSelNum();

    var rs = document.querySelectorAll('input[data-act="check"]');
    for (var r = 0; r < rs.length; r++) {
      rs[r].checked = !!selected[rs[r].getAttribute('data-k')];
    }
    // 每张卡片的表头全选框 —— ⚠️ 必须按「当前作用域」算：
    //    群组视图下，一台设备的可见行只是该群的子集，用 groupPickableRows(dev) 会算错
    var boxes = document.querySelectorAll('input[data-act="checkAll"]');

      var list = cardPickable(dvv);
      var on = 0;
      for (var j = 0; j < list.length; j++) if (selected[list[j].k]) on++;

      boxes[i].indeterminate = on > 0 && on < list.length;

  }

  // ---------- velora 组件还原：渲染期的小工具（2026-10-13 第三轮）----------
  // ① border-beam：整页卡片里塞一层「跑光束」（只用于那 6 个整页视图）
  var BEAM_HTML = '<div class="beam-ring"><span class="beam-run"></span></div>';
  function withBeam(html) { return html.replace('<div class="page-card">', '<div class="page-card">' + BEAM_HTML); }
  // ② moving-border：主要动作按钮（.btn.primary）换成「光斑沿边框跑」的结构。
  //    ⚠️ 必须去掉 primary 类：.btn.primary 是 2 个类的选择器，优先级比 .mb-btn 高，
  //       不去掉的话蓝底会把新样式整个盖掉。
  function applyMovingBorder() {
    var list = document.querySelectorAll('.btn.primary');
    Array.prototype.forEach.call(list, function (b) {
      if (b.classList.contains('mb-btn')) return;
      var label = b.innerHTML;
      b.classList.remove('primary');
      b.classList.add('mb-btn');
      b.innerHTML = '<span class="mb-glow"><span class="mb-light"></span></span>' +
                    '<span class="mb-inner">' + label + '</span>';
    });
  }
  // 主区内容统一入口：写 innerHTML + 应用 moving-border。
  // ⚠️ render() 的分支很多且各自 return，统一走这里才不会漏掉按钮改造。
  function paintMain(html) {
    $('main').innerHTML = html;
    applyMovingBorder();
  }

  // ---------- 渲染 ----------
  function render() {
    // 离开数据表（去导入/导出/库管理等整页）就把搜索定位框清掉，别把旧词带过去
    if (mainView !== 'data') { locateQ = ''; locateIdx = 0; }
    // 同理：离开仪表盘就把大搜索框清掉，并**停掉 placeholder 轮播的定时器**
    if (mainView !== 'dash') { dashQ = ''; dashIdx = 0; dvStop(); }
    // 统计数字现在由 viewBarHtml() 里的 vbStatsHtml() 直接渲染成 HTML（按当前视图算），
    // 不再在这里单独赋值 —— 元素在 main 里，赋值必须等到 innerHTML 之后才行。

    // 设备顺序：补入新出现的设备，并清理「无数据且非手动新增」的设备
    rows.forEach(function (r) { if (deviceOrder.indexOf(r.device) === -1) deviceOrder.push(r.device); });
    var hasRows = {};
    rows.forEach(function (r) { hasRows[r.device] = true; });
    deviceOrder = deviceOrder.filter(function (d) { return hasRows[d] || devManual[d]; });
    // 没有「全部视图」：当前设备不存在了就退回第一个设备
    if (deviceOrder.indexOf(filterDevice) === -1) filterDevice = deviceOrder[0] || '';
    // 群组总览：选中的群要是没了（改名 / 数据被删光）就自动退出群视图，免得停在一个空作用域上
    if (groupScope) {
      var gAlive = false;
      for (var gi = 0; gi < rows.length; gi++) if (rows[gi].group === groupScope) { gAlive = true; break; }
      if (!gAlive) groupScope = '';
    }

    // ⚠️ 「数据类型」下拉是动态的（没数据的类别不出现）→ 先确认当前选中项还活着，没了就退回「全选」。
    //    必须在拼 HTML 之前跑（下拉要按定稿后的 pickType 渲染）。
    normalizePickType();
    // ⚠️ 2026-10-15 起这里**不再自动全选**（syncAutoSelect 已删）—— 勾选从空开始，详见上面那段说明。

    // 侧栏三段式：标题 / 设备列表（撑满、自己滚）/ 底部全局操作
    var counts = {};

  //    设备层：同一套色相家族，降饱和/提明度 → **更柔和**
  var FUNC_COLORS = {
    dash: '#3b6ef0',   // 仪表盘（品牌蓝）
    imp:  '#0e8fa8',   // 导入粉丝（青）
    exp:  '#178a5e',   // 导出表格（绿）
    book: '#6b4fe0',   // 名单管理（紫）
    arch: '#c97a12',   // 数据备份（橙）
    add:  '#4a7fc1',   // 新增设备（蓝）
    mg:   '#6b7d94'    // 管理设备（灰蓝）
  };
  // ⚠️ 原来的 8 色固定色板（DEV_COLORS）已删除 —— 它和表格里的设备色条是**两套色**，
  //    同一台设备在侧栏是蓝的、在表格里是红的，看着不协调（2026-10-12 牛牛要求"更协调"）。
  //    现在侧栏图标 / 表格色条 / 导出 Excel 全部由下面的 devHue() 一套色相推出来。
  // 按设备在侧栏里的**顺序**取色相（不是按名字哈希）—— 保证相邻两台设备永远不同色
  function devColor(dev) { return hslToHex(devHue(dev), 0.50, 0.55); }
  // ---------- 设备颜色：一套色相，两种深浅 ----------
  // 用户 2026-10-12 要求：设备列相同设备同色、**所有设备不能同色**。
  // 用黄金角 137.508° 递推色相 → 任意台数都不会撞色（固定 8 色的调色板做不到这点）。
  //    · 侧栏设备图标 / 表格左侧竖色条 = devColor()（S .50 / L .55）—— 牛牛要求两者**必须同色**
  //    · 导出 Excel 的大片填充        = devFillColor()（S .62 / L .86）—— 大面积填色不能刺眼
  // 两者色相同源 → 界面上看到的颜色和 Excel 里是同一个色系，对得上号。
  function hslToHex(h, s, l) {
    h = ((h % 360) + 360) % 360;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    var m = l - c / 2, r, g, b;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    function two(v) {
      var n = Math.round((v + m) * 255);
      n = n < 0 ? 0 : (n > 255 ? 255 : n);
      return ('0' + n.toString(16)).slice(-2);
    }
    return '#' + two(r) + two(g) + two(b);
  }
  // 设备 → 色相（把「不在顺序表里」的兜底逻辑收在这里，两个取色函数共用）
  function devHue(dev) {
    var i = deviceOrder.indexOf(dev);
    // 兜底：设备不在顺序表里时按名字取一个稳定下标（正常流程下 render() 会把所有设备补进 deviceOrder，
    // 走不到这里；但万一走到，-1 会让它和第一台设备撞色，所以必须兜住）
    if (i < 0) { var h = 0; for (var j = 0; j < dev.length; j++) h = (h * 31 + dev.charCodeAt(j)) % 997; i = h; }
    // ⚠️ 起点 +210°：让第 1 台设备落在**蓝色**（老固定色板第一格 #6b8fd6 就是这个色系），
    //    不要第 1 台就是正红 —— 红色在本工具里是「不在库」的告警色，撞了会误导。
    return i * 137.508 + 210;
  }
  // 大片色块用的**浅色**（导出 Excel 的设备列填充）
  function devFillColor(dev) { return hslToHex(devHue(dev), 0.62, 0.86); }

  // 侧栏一行：图标 + 设备名 + 条数（激活时图标变蓝、文字加粗 —— 见 CSS）。
  // 双击改名 / 拖拽排序已移除，改由「管理设备」页负责删除与排序。
  function devItemHtml(dev, label, cnt, alert) {
    // 只有「数据表 + 按设备看」视图才显示激活项 ——
    //   · 停在导入/导出/管理设备等整页时，侧栏不该还亮着某个设备（这个 bug 已修）
    //   · 群组视图下也不该亮（那时屏幕上是"某个群"，不是"某台设备"）
    var on = (mainView === 'data' && !groupScope && filterDevice === dev);
    return '<div class="dev-item' + (on ? ' active' : '') + '" data-dev="' + esc(dev) + '" title="单击查看"' +
      ' style="--ac:' + devColor(dev) + '">' +
      ICON.device +
      '<span class="nm">' + esc(label) + '</span>' +
      // alert = 该设备有「不在库」或「已分配」数据 → 数字右上角冒红点
      '<span class="cnt">' + cnt + (alert ? '<i class="dot"></i>' : '') + '</span></div>';
  }

  // 统计：本组人数 / 不在库 / 已分配 / 已拉群 / 群组。只统计「未完成」的行（已完成单独在折叠区展示）。
  // ⚠️ 走 viewRows() —— 群组视图下算的是「这个群跨所有设备的合计」，不是当前那一台设备
  function vbStatsHtml() {
    var nTotal = 0, nOol = 0, nPend = 0, nLaunch = 0, gset = {};
    viewRows().forEach(function (r) {
      if (r.status === 'done') return;
      nTotal++;
      if (r.status === 'pending') nPend++;
      if (r.status === 'launched') nLaunch++;
      if (outOfLib(r)) nOol++;
      if (r.group) gset[r.group] = true;
    });
    return '<div class="vb-stats">' +
      '<span class="v-total">本组条数 <b>' + nTotal + '</b></span><span class="sep">·</span>' +
      '<span class="v-ool">不在库 <b>' + nOol + '</b></span><span class="sep">·</span>' +
      '<span class="v-pending">已分配 <b>' + nPend + '</b></span><span class="sep">·</span>' +
      '<span class="v-launched">已拉群 <b>' + nLaunch + '</b></span><span class="sep">·</span>' +
      '<span class="v-group">群组 <b>' + Object.keys(gset).length + '</b></span></div>';
  }

  // 自定义下拉（2026-10-13 第三轮）：**向上弹** ——
  //   原生 <select> 的弹出方向由浏览器/系统决定，CSS 改不了，窗口一缩就弹到界面外（牛牛反馈）。
  //   这里用「按钮 + 绝对定位列表（bottom: calc(100% + 6px)）」自己实现，方向完全可控。
  function ddHtml(id, label, cur, items, act) {
    var opts = items.map(function (it) {
      return '<button type="button" class="vb-dd-opt' + (it[0] === cur ? ' on' : '') + '"' +
        ' data-act="' + act + '" data-v="' + it[0] + '">' + it[1] + '</button>';
    }).join('');
    return '<span class="vb-dd" data-dd="' + id + '">' +
      '<button type="button" class="vb-dd-btn" data-act="ddToggle" data-dd="' + id + '">' +
      '<span>' + label + '</span>' + ICON.caret + '</button>' +
      '<div class="vb-dd-list" id="' + id + '" hidden>' + opts + '</div></span>';
  }
  // 「数据类型」下拉：从哪一类里自下而上挑人。选项顺序见 PICK_TYPES，第一项是「全选」。
  // ⚠️ 选项是**动态**的（见 pickTypes()）：当前作用域里没数据的类别不出现。
  // ⚠️ 2026-10-15 牛牛要求（甲A）：按钮**恒定显示占位「选择类型」**，完全照抄右边「修改类型」的「选择操作」——
  //    两边长得对称。当前选中的是哪一档，靠**列表里那一项的高亮（.on）**表示，不再写到按钮上。
  //    ⚠️ 所以任何地方都不要再拿按钮文字当"当前类型"用（测试也改成读 .vb-dd-opt.on）。
  function typeSelectHtml() {
    return ddHtml('vbType', '选择类型', pickType,
      pickTypes().map(function (t) { return [t.v, t.label]; }), 'pickType');
  }
  // 「修改类型」下拉（2026-10-13 第二轮改版）：选项**跟着「数据类型」变**（牛牛给的对照表）——
  //   数据类型 = 全选   → 4 项全出现（设置群名称 / 设为未分配 / 设为已拉群 / 设为已分配）
  //             未分配 → 只有「设置群名称」
  //             已分配 → 退回未分配 / 设为已拉群
  //             已拉群 → 只有「退回已分配」
  //             已完成 → 退回已拉群（＝原来的「↺ 恢复」）
  // ⚠️ 2026-10-14 牛牛要求：「设为已完成」**整个拿掉**（默认档和已拉群档都去掉）——
  //    「已完成」本来就是「导出表格」导出「已拉群」时**自动打上**的，不该再留手动入口。
  //    要撤销导出，就进「已完成」档点「退回已拉群」。
  // ⚠️ 2026-10-13「设置群名称」只在**还没有群名**的两档（默认 / 未分配）出现 ——
  //    已经「已分配」的人本来就有群名，改群名直接双击表格里的群名称格。
  // ⚠️「删除」已从这个下拉里**彻底拿掉** —— 删除统一走**表头那个垃圾桶 = 删除选中**。
  // ⚠️ 第一项永远是**占位项**（空 value）—— 每次选完都要复位回它，
  //    否则下次再选同一个操作不会触发 change（下拉当"菜单"用必须这么处理）。
  var BATCH_MENU = {
    all:      [['group', '设置群名称'], ['unassign', '设为未分配'], ['launched', '设为已拉群'], ['assign', '设为已分配']],
    none:     [['group', '设置群名称']],
    pending:  [['unassign', '退回未分配'], ['launched', '设为已拉群']],
    launched: [['assign', '退回已分配']],
    done:     [['restore', '退回已拉群']]
  };
  function batchSelectHtml() {
    var items = BATCH_MENU[pickType] || BATCH_MENU.all;
    return ddHtml('vbBatch', '选择操作', '', items, 'batchPick');
  }
  // 操作栏（数据页，2026-10-13 按牛牛要求**清空重做**，第二轮再微调）：一行 = 三件套 + 右侧统计 ——
  //   ① 数据类型：从哪一类里挑（全选 / 未分配 / 已分配 / 已拉群 / 已完成）——**选中即整类全勾**
  //      ⚠️ 按钮上恒显示占位「选择类型」，当前档靠列表里的高亮表示（见 typeSelectHtml）
  //   ② 选中 N：填个数字 → ✓（回车同）= 自下而上选中 N 个；✗ = 取消（清空所有勾选）
  //   ③ 修改类型：下拉，**选项跟着「数据类型」变**（见 BATCH_MENU）；选一项就执行 / 弹小窗
  // 位置在卡片下方，并且**吸在窗口底部**：main.is-data + .vb-spacer 一起把"没数据"的情况也顶到底部。
  // ⚠️ 原来的 ▢未分配 / ▢已分配 / 群名输入框 / ⚑标记已拉群 已**整块删除**（连 CSS 和背后的函数）。
  function viewBarHtml() {
    return '<div class="view-bar"><div class="vb-row">' +
      '<span class="vb-lab">数据类型' + typeSelectHtml() + '</span>' +
      // 「选中 N」的 N 是个**可输入的框**，后面跟 ✓ 确定 / ✗ 取消两个线性图标
      '<span class="vb-sel">选中 <input id="selNum" class="vb-num" type="text" inputmode="numeric" autocomplete="off"' +
        ' value="' + selCount() + '" title="填个数字 → 点 ✓ = 按「数据类型」自下而上选中这么多；点 ✗ = 清空所有勾选">' +
        '<button class="vn-act ok" data-act="selNumOk" title="确定：自下而上选中 N 个（回车同）">' + ICON.check + '</button>' +
        '<button class="vn-act no" data-act="selNumNo" title="取消选中：清空所有勾选（Esc 同）">' + ICON.no + '</button></span>' +
      // 「修改类型」：和左边「数据类型」**同款小标签 + 下拉**（牛牛："加小字是在选择操作边上加一个修改类型"）。
      '<span class="vb-lab">修改类型' + batchSelectHtml() + '</span>' +
      '<span class="vb-stats-right">' + vbStatsHtml() + '</span>' +
      '</div></div>';
  }

  // ---------- 群组（2026-10-13 重构：操作栏那个上拉面板 → 侧栏独立列表）----------
  // 存在的意义：两个设备拼的**同一个群**，以前只能一台台设备切过去看，看不到合计。
  //   · 侧栏「群组列表」一列列出来：群名 + 总人数，悬停 title 看每台设备各几人
  //   · 点一项 → 主区把该群**所有设备**的数据合成**一张表**（牛牛：表头只有一个）
  //     ⚠️ 点它会**自动全选整群**（2026-10-13 第三轮改口；再点同一个群则什么都不变，见 setGroupScope）
  //   · 群组顺序 = **创建顺序**（第一次被填写的先后，见上方 grpOrderList()）
  // 群名 → { total, undone, devs: {设备: 条数}, last }（跨设备聚合）
  //   last = 该群里**最后一条完成**的时间戳（已完成行的 max doneAt）—— 只给侧栏「已完成群组」排序用。
  //   ⚠️ 取 **max** 而不是 min：和导出归档（archivePlanOf 里的 last）**同一口径**，两处不能各说各话。
  //   ⚠️ doneAt 是 2026-10-14 才加的字段 → 更早完成的老数据没有 → 当 0（= 最早，沉到最下面）。
  function groupIndex() {
    var m = {};
    rows.forEach(function (r) {
      if (!r.group) return;
      var g = m[r.group] || (m[r.group] = { total: 0, undone: 0, devs: {}, last: 0 });
      g.total++;
      if (r.status !== 'done') g.undone++;
      else if ((r.doneAt || 0) > g.last) g.last = r.doneAt || 0;   // 只数已完成的行
      g.devs[r.device] = (g.devs[r.device] || 0) + 1;
    });
    return m;
  }
  // 侧栏一行群组：群名 + 总人数；悬停 title 看每台设备各几人（牛牛："只在悬停时用提示显示"）
  function grpListItemHtml(g, m) {
    var tip = Object.keys(m[g].devs).map(function (d) { return d + ' ' + m[g].devs[d] + ' 条'; }).join('\n');
    var on = (mainView === 'data' && groupScope === g);
    return '<div class="grp-item' + (on ? ' active' : '') + '" data-act="pickGrp" data-g="' + esc(g) + '"' +
      ' title="' + esc(g + '\n' + tip + '\n点击查看这个群（所有设备）') + '">' +
      ICON.usersSm + '<span class="nm">' + esc(g) + '</span>' +
      '<span class="cnt">' + m[g].total + '</span></div>';
  }
  // 侧栏「群组列表」整段。
  //   · 没有任何群名 → **整段返回空串**（侧栏布局纹丝不动）
  //   · 整个群都完成的收进「已完成群组 (N)」小节（`undone === 0` 判定），**默认折叠、手动展开/收起**
  //   · ⚠️ 两段排序**不一样**：进行中 = **创建顺序**；已完成 = **最近完成的排最上面**（2026-10-16 牛牛定）
  function sidebarGrpHtml() {
    var m = groupIndex();
    var names = grpOrderList();
    if (!names.length) return '';
    var live = [], fin = [];
    names.forEach(function (g) { (m[g].undone > 0 ? live : fin).push(g); });
    // ⚠️ 已完成按「该群最后一条完成的时间」倒序（= max doneAt，与导出归档同口径，见 groupIndex 的 last）。
    //   · ⚠️ 一次导出给整批打的是**同一个时间戳** → 并列是常态 → **只能靠稳定排序**保留上面的
    //     「创建顺序」当次序。所以这里**绝不能再写会打乱并列的次级比较**（比如再按群名排）。
    //     （Array.sort 在现代 V8 / Chromium 里是稳定的，项目里别处也依赖这一点。）
    //   · 没有 doneAt 的老数据当 0 → 自然沉到最下面。
    //   · 进行中那一段（live）**保持创建顺序不动**。
    fin.sort(function (a, b) { return (m[b].last || 0) - (m[a].last || 0); });
    // ⚠️ 2026-10-13：原来这里有一条 <div class="side-hr"> 分割线，牛牛要求
    //   「设备列表和群组列表要在一个区域里」—— 已删除，两栏直接相邻、同属一个视觉区域。
    var h = '<div class="side-title' + (grpListCollapsed ? '' : ' open') + '" data-act="toggleGrpList"' +
      ' title="点击收起 / 展开群组列表">' + ICON.users + '<span>群组列表</span>' +
      '<span class="dt-caret">' + (grpListCollapsed ? '▸' : '▾') + '</span></div>';
    h += '<div class="grp-list-body"' + (grpListCollapsed ? ' hidden' : '') + '>';
    live.forEach(function (g) { h += grpListItemHtml(g, m); });
    if (!live.length) h += '<div class="grp-none">暂无进行中的群组</div>';
    if (fin.length) {
      h += '<button class="grp-sub" data-act="toggleGrpDoneList">' +
        '<span class="caret">' + (grpListDoneOpen ? '▾' : '▸') + '</span>' +
        '<span>已完成群组 (' + fin.length + ')</span></button>';
      h += '<div class="grp-done-body"' + (grpListDoneOpen ? '' : ' hidden') + '>';
      fin.forEach(function (g) { h += grpListItemHtml(g, m); });
      h += '</div>';
    }
    h += '</div>';
    return h;
  }
  // （原操作栏的「群组」上拉面板 —— grpPanelInner / grpBarHtml / renderGrpPanel —— 已按牛牛要求**整块删除**：
  //   群组现在在侧栏「群组列表」里，不再占操作栏，也就不需要那块面板和它的局部重绘逻辑了。）
  // 选中一个群（'' = 退出群视图，回到按设备看）
  // 2026-10-13 三改定稿：点群名 = 跳过去看（跨设备合成一张表）。
  // ⚠️ 2026-10-15 起**不再自动全选整群**（牛牛：按钮是占位「选择类型」却把整群勾上，自相矛盾）——
  //   要全选就在下拉里点「全选」。再点**同一个群** → 直接 return，什么都不变。
  //   · 勾选口径和「点设备」完全一致：**切作用域就清空勾选**，之后从空开始
  //   · 点到的群如果整个都已经完成 → 顺手把群视图那张表的「已完成」折叠区展开，
  //     否则跳过去看到的是一屏空白（看不到人就没法恢复 / 删除）。这条**保留**。
  function setGroupScope(g) {
    if (g === '') {                       // '' = 退出群视图，回到按设备看
      if (groupScope === '' && mainView === 'data') return;   // 本来就没进群视图 → 什么都不用做
      groupScope = ''; selected = {};
      mainView = 'data'; render(); return;
    }
    // ⚠️ 2026-10-13：点的还是**当前这个群**（且已经在数据页）→ 什么都不做，直接返回。
    //    不加这一句的话会掉进下面"清空勾选"，于是「点群名 → 自动全选整群」之后
    //    再点一下同一个群，勾选会被清成 0（和"再点一下什么都不变"的既定行为矛盾）。
    if (g === groupScope && mainView === 'data') return;
    groupScope = g;
    mainView = 'data';
    selected = {};                        // 切作用域 → 清空勾选（紧接着 render() 里的自动全选会重新勾上）
    var m = groupIndex();
    // 整个群都已完成 → 把群视图那张表的「已完成」区展开（它在 doneCollapsed 里用的是 GRP_KEY）
    if (m[g] && m[g].undone === 0) doneCollapsed[GRP_KEY] = false;
    render();
  }
  // ⚠️ 2026-10-13 操作栏重做时一并删除的旧函数（别引回来）：
  //   allSel / tailAllSelected / pendAllSelected —— 「▢未分配 / ▢已分配」两个按钮的激活态判定
  //   cancelWarn / cancelTitle / cancelPick —— 给旧「取消」按钮做样式和提示的
  //   submitGroup / confirmPick / pickToggle / pickTail / pickPend / keysOf —— 旧操作栏那整套交互
  //   「批量设群名 / 批量删群名」现在走 batchSetGroup()（操作栏「修改类型 → 设置群名称」，留空 = 清空）

  // 8 列列宽（勾选 + 6 文字列 + 删除）。table-layout:fixed 只看表头第一行，宽度在这里一次性定死。
  // ⚠️ 2026-10-13 由「纯百分比」改成「px」：百分比在窄窗口会把勾选/删除列压到比图标本身还窄
  //    （3.0% / 3.2%），被 overflow:hidden 裁掉一半 → 看着像"两边各多了一个方块"；中间几列也会被压出省略号。
  //    改成 px 之后：
  //      · 窗口窄 → 触发表格 min-width（见 CSS，880px）→ 表格**横向滚动**，列不再被压扁；
  //      · 窗口宽 → Chrome 把富余宽度**按各列 px 比例**摊回去 → 观感与原来的百分比版一致。
  //    这 8 个 px 是照**原来的百分比**反算的（基准 881px）：28/158/215/186/88/88/88/30
  //      ≈ 3.2% / 17.9% / 24.4% / 21.1% / 10.0% / 10.0% / 10.0% / 3.4%
  //    同时每列都 ≥ 它内容的硬下限：勾选 15+8+1=24 → 28；垃圾桶 14+6+8+1=29 → 30；
  //      「状态」的胶囊 3 字×12+20+24+1=81 → 88。
  //    ⚠️ 改这里必须同步改 CSS 里 table 的 min-width（= 这 8 个数之和 881 → 写成 880px）。
  var CW8 = { c: '28px', g: '158px', n: '215px', i: '186px', d: '88px', t: '88px', s: '88px', x: '30px' };
  function headCheckHtml(dev, keys) {
    var onN = keys.filter(function (k) { return selected[k]; }).length;
    return '<th class="chk" style="width:' + CW8.c + '"><input type="checkbox" data-act="checkAll" data-dev="' + esc(dev) + '"' +
      (keys.length && onN === keys.length ? ' checked' : '') + ' title="全选可操作的数据（不含已完成 / 不在库）"></th>';
  }
  function headDelHtml(dev) {
    // ⚠️ 2026-10-13 牛牛改口：表头垃圾桶**不再删「整列表」**，改成 **= 删除选中**（见事件委托里的 delSel）。
    //    没勾选时只提示、不动数据；删完 6 秒可撤销。
    return '<th class="col-del" style="width:' + CW8.x + '"><button class="row-del" data-act="delSel" data-dev="' + esc(dev) +
      '" title="删除勾选的数据（没勾选时会先提示）">' + ICON.trash + '</button></th>';
  }
  function theadHtml(dev, keys) {
    return '<thead><tr>' + headCheckHtml(dev, keys) +
      '<th style="width:' + CW8.g + '">群名称</th>' +
      '<th style="width:' + CW8.n + '">数据昵称</th>' +
      '<th style="width:' + CW8.i + '">数据ID</th>' +
      '<th style="width:' + CW8.d + '">设备名</th>' +
      '<th style="width:' + CW8.t + '">日期</th>' +
      '<th style="width:' + CW8.s + '">状态</th>' +
      headDelHtml(dev) + '</tr></thead>';
  }

  // 「已完成」区的排序（牛牛 2026-10-13 改口定稿）：
  //   **以「原（未分配）顺序」为主，只把同群名的归在一起** ——
  //     ① 先按群名聚簇，簇内保持列表原始顺序（= 导入正序，跟未分配一样）
  //     ② 簇与簇之间按**簇内第一条在原始列表里的位次**排
  //   ⚠️ 不再按 doneAt（交单/完成时间）倒序 —— doneAt 字段还留着（撤销快照要用），只是不参与排序。
  //   ⚠️ 未完成区**不按群名排**，只按 2026-10-14 新增的**上传批次倒序**（最新上传的在上、
  //      同一批内部保持原顺序），见下方 tableCard()。已完成区**不走这套**，保持"原顺序为主"。
  function sortDoneRows(list) {
    var clusters = [], m = {};
    list.forEach(function (r, i) {
      var g = r.group || '';
      if (!(g in m)) { m[g] = { key: g, i: i, rows: [] }; clusters.push(m[g]); }
      m[g].rows.push(r);
    });
    clusters.sort(function (a, b) { return a.i - b.i; });       // 首次出现的位置 → 整体保持原顺序
    var out = [];
    clusters.forEach(function (c) { out = out.concat(c.rows); });
    return out;
  }

  // 表格卡片（单设备 / 群组视图共用）。
  //   scopeKey = 作用域键：普通视图 = 设备名；群组视图 = GRP_KEY
  //   进行中与已完成共用同一张 <table>，列宽天然对齐（已完成折叠靠第二个 <tbody> 的 display:none）
  function tableCard(scopeKey, vis) {
    var showCheck = true;                           // 有勾选列
    var isGrp = (scopeKey === GRP_KEY);
    // ⚠️ 2026-10-14 牛牛要求：**未完成区按"上传批次"倒序** —— 最新上传的那份文档的数据在最上，
    //    同一份文档（同一批次）内部**保持原顺序**（靠稳定排序保证）。见上方 sortByBatchDesc()。
    //    `rows` 本身仍是导入正序，这里只排**渲染用的副本**。
    //    · 老数据没有 `batch` 字段 → 当作第 0 批 → 永远沉在最下面
    //    · ⚠️ 「选中 N」**必须用同一个 sortByBatchDesc**（见 typePoolInDisplayOrder）——
    //      不然显示一套顺序、选中另一套，勾出来会"中间空一片"
    //    · 已完成区**不按批次排**（它有自己的定稿：原顺序为主 + 同群名聚在一起，见 sortDoneRows）
    var active = sortByBatchDesc(vis.filter(function (r) { return r.status !== 'done'; }));
    var done = sortDoneRows(vis.filter(function (r) { return r.status === 'done'; }));
    var collapsed = doneCollapsed[scopeKey] !== false;
    // 表头「全选」复选框的候选行 —— ⚠️ 必须走 cardPickable(scopeKey)（当前作用域内的可操作行）：
    //    群组视图下整张表就是这个群（走 viewPickable()），普通视图下就是这台设备
    var activeKeys = cardPickable(scopeKey).map(function (r) { return r.k; });
    var colN = 8;                                   // 勾选 + 6 文字列 + 删除
    var h = '<div class="group-card" data-dev="' + esc(scopeKey) + '">';
    h += '<table>' + theadHtml(scopeKey, activeKeys);
    h += '<tbody>';
    active.forEach(function (r) { h += rowHtml(r, showCheck); });
    if (!active.length) h += '<tr><td colspan="' + colN + '" style="color:var(--muted);text-align:center">' +
      (isGrp ? '本群暂无进行中的数据' : '本组暂无数据') + '</td></tr>';
    if (done.length) {
      var doneGset = {};
      done.forEach(function (r) { if (r.group) doneGset[r.group] = true; });
      h += '<tr class="done-divider"><td colspan="' + colN + '"><div class="done-bar">' +
        '<button class="done-toggle" data-act="toggleDone" data-dev="' + esc(scopeKey) + '">' +
        (collapsed ? '▸' : '▾') + ' 已完成（' + done.length + '）' +
        (isGrp ? '' : (' · 群组（' + Object.keys(doneGset).length + '）')) +
        ' · 点击' + (collapsed ? '展开' : '折叠') +
        '</button>' +
        // 「恢复」放在垃圾桶**左边**：把勾选的已完成数据退回「已拉群」
        '<button class="done-act undo" data-act="restoreDone" data-dev="' + esc(scopeKey) +
        '" title="把「勾选」的已完成数据恢复成「已拉群」（带撤销）">' + ICON.undo + '</button>' +
        '<button class="done-act del" data-act="delAllDone" data-dev="' + esc(scopeKey) + '" title="删除全部已完成数据（有确认）">' + ICON.trash + '</button>' +
        '</div></td></tr>';
    }
    h += '</tbody>';
    if (done.length) {
      h += '<tbody class="done-wrap' + (collapsed ? ' collapsed' : '') + '">';
      done.forEach(function (r) { h += rowHtml(r, showCheck); });
      h += '</tbody>';
    }
    h += '</table></div>';
    return h;
  }

  function emptyGroupCard(dev) {
    return '<div class="group-card" data-dev="' + esc(dev) + '">' +
      '<div class="empty-group">这台设备还没有数据 —— 点左下角「导入粉丝」，把它的采集文件导进来</div></div>';
  }

  // 全部视图已删除 —— 原来的 allViewCard（多设备合并成一张表）随之去掉。
  // 现在只剩 tableCard(scopeKey, vis) 这一条表格构建路径（单设备 / 群组视图共用），改动时不会再有「两处要同步改」的负担。

  function rowHtml(r, showCheck) {
    var checked = selected[r.k] ? ' checked' : '';
    var ool = outOfLib(r);
    var bd = badgeOf(r);
    // 「已完成」的行现在**可以勾选**了 —— 用来批量「恢复」回已拉群。
    // ⚠️ 只有「不在库」还锁着（outOfLib 对已完成的行本来就返回 false，所以已完成不会被误锁）。
    var locked = ool;
    var h = '<tr class="' + (r.status === 'done' ? 'row-done' : '') + '" data-k="' + esc(r.k) + '">';
    if (showCheck) {
      h += '<td class="chk"><input type="checkbox" data-act="check" data-k="' + esc(r.k) + '"' + checked + (locked ? ' disabled' : '') +
        (ool ? ' title="不在库 · 不可勾选"' : (r.status === 'done' ? ' title="勾上后可点右侧「恢复」退回已拉群"' : '')) + '></td>';
    }
    h += '<td class="groupname" data-field="group" data-k="' + esc(r.k) + '" title="' + esc(r.group) + '">' + (r.group ? esc(r.group) : '<span style="color:var(--muted);font-weight:400">—</span>') + '</td>' +
      '<td class="nick" data-field="nick" data-k="' + esc(r.k) + '" title="' + esc(r.nick) + '">' + esc(r.nick) + '</td>' +
      '<td data-field="id" data-k="' + esc(r.k) + '">' + esc(r.id) + '</td>' +
      // 设备名列：左边一条竖色条，颜色 = **侧栏那台设备的线性图标色**（同一套 devColor，对得上号）
      '<td class="dev-cell" title="' + esc(r.device) + '" style="--dc:' + devColor(r.device) + '">' + esc(r.device) + '</td>' +
      '<td class="date" title="' + esc(r.date) + '">' + esc(shortDate(r.date)) + '</td>' +
      '<td><span class="badge ' + bd.cls + '">' + bd.text + '</span></td>' +
      '<td class="col-del"><button class="row-del" data-act="delRow" data-k="' + esc(r.k) + '" title="删除该条（无确认）">' + ICON.trash + '</button></td></tr>';
    return h;
  }

  // ---------- 双击编辑 ----------
  function startEdit(td) {
    if (td.classList.contains('editing')) return;
    var k = td.getAttribute('data-k'), field = td.getAttribute('data-field');
    var row = findRow(k); if (!row) return;
    // 做到「双击前后零位移」，四个量必须在改动 DOM 之前一次性量好：
    //   rect   → 单元格完整外框（稍后锁到 td.style.width，整列宽度不变）
    //   inner* → 扣掉边框后的整格外框（编辑态单元格 padding 归零，输入框正好铺满）
    //   pad    → 单元格原有内边距（原样交给输入框，文字位置分毫不动）
    var cs = getComputedStyle(td);
    var rect = td.getBoundingClientRect();
    var bL = parseFloat(cs.borderLeftWidth) || 0, bR = parseFloat(cs.borderRightWidth) || 0;
    var bT = parseFloat(cs.borderTopWidth) || 0, bB = parseFloat(cs.borderBottomWidth) || 0;
    var r2 = function (n) { return Math.round(n * 100) / 100; };
    var w = r2(rect.width);
    var innerW = r2(rect.width - bL - bR);
    var innerH = r2(rect.height - bT - bB);
    var pad = cs.paddingTop + ' ' + cs.paddingRight + ' ' + cs.paddingBottom + ' ' + cs.paddingLeft;
    td._old = td.innerHTML;
    td._field = field; td._k = k;
    td.style.width = w + 'px';
    // 防御性解除 max-width：旧版把 max-width 写在 <td> 上时，一旦这里设了明确 width，
    // max-width 会立刻生效并把该列压窄、其余列撑大（曾实测跳动 70px）。
    // 现在列宽由 table-layout:fixed + 表头百分比锁死，这行留作兜底，
    // 防止将来有人再往 <td> 上加 max-width 把固定布局搞乱。
    td.style.maxWidth = 'none';
    td.classList.add('editing');
    td.innerHTML = '<input class="cell-edit" value="' + esc(row[field] || '') + '">';
    var el = td.firstChild;
    el.style.width = innerW + 'px';      // 外框与单元格边界重合
    el.style.height = innerH + 'px';
    el.style.padding = pad;              // 内边距与单元格原值一致 → 文字不缩进、不跳动
    if (el.focus) el.focus();
    if (el.select) { try { el.select(); } catch (e) {} }
    el.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); commitEdit(td); }
      else if (ev.key === 'Escape') { ev.preventDefault(); cancelEdit(td); }
    });
    el.addEventListener('blur', function () { commitEdit(td); });
  }
  function cancelEdit(td) {
    if (!td.classList.contains('editing')) return;
    td.classList.remove('editing');
    td.style.width = '';
    td.style.maxWidth = '';
    td.innerHTML = td._old;
  }
  function commitEdit(td) {
    if (!td.classList.contains('editing')) return;
    var field = td._field, k = td._k;
    var el = td.querySelector('input');
    var val = el ? el.value.trim() : '';
    td.classList.remove('editing');
    td.style.width = '';
    td.style.maxWidth = '';
    var row = findRow(k);
    if (row) applyFieldEdit(row, field, val);
    save(); render();
  }
  function applyFieldEdit(row, field, val) {
    var oldVal = row[field];
    if (field === 'nick') { row.nick = val; }
    else if (field === 'group') {
      row.group = val;
      // 「有群名 = 已进入流程」：从「未分配」填上名字 → 已分配；
      // 名字被清空 → 无论原来是 已分配 还是 已拉群，都退回「未分配」（已完成不动，它已经交单）
      if (val && row.status === 'none') row.status = 'pending';
      if (!val && row.status !== 'done') row.status = 'none';
      // 群组创建顺序（2026-10-13）：新填的名字记上；改名字时看情况 ——
      //   · 旧群名还有别的行在用（只是拆了一行出去）→ 新名字排到列表末尾
      //   · 旧群名一行都不剩了（整个群改名）→ **原地换名**，保持它在侧栏列表里的位置
      if (val !== oldVal) {
        var oldStill = false;
        if (oldVal) for (var qi = 0; qi < rows.length; qi++) if (rows[qi].group === oldVal) { oldStill = true; break; }
        if (oldStill) touchGroupOrder(val); else renameGrpOrder(oldVal, val);
      }
    }
    else if (field === 'id') {
      if (!val || val === row.id) return;
      var dup = false;
      rows.forEach(function (x) { if (x !== row && x.id === val) dup = true; });
      if (dup) { toast('数据ID「' + val + '」已经有了，没改', null, 'block'); return; }
      row.id = val;
    }
  }

  // ---------- 删除的撤销 ----------
  // ⚠️ 2026-10-14 牛牛定调：**撤销只保留「删除」类**（表头「删除选中」+ 已完成区「删除全部已完成」+
  //    「恢复备份」），其余动作一律不再挂撤销 —— 它们都能用「修改类型」原路退回，撤消按钮是多余的。
  //    实现统一收在 deleteRowsByKeys()（下方 2757 行附近）：按**原来的索引位置**插回，而不是一股脑堆到末尾。

  // ---------- 批量设群名 / 取消群名 ----------
  // applyGroup(name, keys?)：keys 省略时用「当前勾选」（操作栏「修改类型 → 设置群名称」就是走这条）。
  function applyGroup(name, keys) {
    name = (name || '').trim();
    if (!name) { toast('还没填群名'); return; }
    keys = keys || Object.keys(selected).filter(function (kk) { return selected[kk]; });
    if (!keys.length) { toast('还没勾选数据 —— 先在每行前面的方格里打个勾'); return; }
    var inKeys = {}; keys.forEach(function (x) { inKeys[x] = true; });
    var n = 0, nSkip = 0;
    rows.forEach(function (r) {
      if (!inKeys[r.k]) return;
      // 「已完成」不参与改群名（它已经是交完的状态），但**要数出来告诉用户**，
      // 否则会以为按钮没生效 —— 想改就得先点「恢复」
      if (r.status === 'done') { nSkip++; return; }
      if (outOfLib(r)) return;                                            // 不在库 也不参与
      r.group = name; r.status = 'pending'; n++;
    });
    if (!n) {
      toast(nSkip ? ('勾选的 ' + nSkip + ' 条都是「已完成」的 —— 先点「恢复」退回「已拉群」，才能改群名')
                  : '选中的行无法设为已分配');
      return;
    }
    touchGroupOrder(name);       // 群名第一次被填上 → 记进「创建顺序」（侧栏列表 & 导出都按它排）
    selected = {};               // 执行后取消勾选
    save(); render();
    // ⚠️ 2026-10-14：撤销只保留「删除」类 —— 改群名不再挂撤销
    toast('已将 ' + n + ' 条设为「已分配」，群名：' + name +
          (nSkip ? '（另有 ' + nSkip + ' 条已完成被跳过，需先恢复）' : ''));
  }
  // ---------- 批量修改（2026-10-13 新增；第二轮扩成 5 个动作，挂在操作栏「修改类型」下拉上）----------
  // 勾选的行（key 列表）—— 下面这些动作都作用在它上面
  function selKeys() { return Object.keys(selected).filter(function (kk) { return selected[kk]; }); }
  // 下拉里选了某一项 → 执行对应动作 / 弹对应小窗。
  //   ⚠️ 自定义下拉（2026-10-13 第三轮）不再需要像原生 select 那样「复位回占位项」—— 列表点完自动关。
  //   ⚠️ 选项集合由 BATCH_MENU 按 pickType 给，这里只负责分发（不再有「删除」）。
  function batchPick(v) {
    if (!v) return;
    var lbl = batchOptionLabel(v);
    if (v === 'group') batchSetGroup(lbl);
    else if (v === 'launched') batchSetLaunched(lbl);
    else if (v === 'unassign') batchSetUnassign(lbl);
    else if (v === 'assign') batchSetAssigned(lbl);
    else if (v === 'restore') restoreDone();          // 「设为已拉群」在「已完成」那一档 = 原来的「↺ 恢复」
  }
  // 「修改类型」当前档里某个动作显示的文字。
  // ⚠️ 弹窗标题跟着它走 —— 免得菜单写「退回未分配」、弹窗却写「设为未分配」，同一次点击两个说法。
  function batchOptionLabel(v) {
    var items = BATCH_MENU[pickType] || BATCH_MENU.all;
    for (var i = 0; i < items.length; i++) if (items[i][0] === v) return items[i][1];
    return '';
  }
  // 「修改类型」里各项统一的前置检查：没勾选就给一句指路，别让小窗白弹。
  function batchKeysOrHint() {
    var keys = selKeys();
    if (!keys.length) toast('还没勾选数据：先在「选中」里填个数字 → 点 ✓');
    return keys;
  }
  // ① 设置群名称：小窗里输入。**留空 + 回车/确定 = 清空群名、退回「未分配」**（牛牛要求保留这个语义）
  function batchSetGroup(title) {
    var keys = batchKeysOrHint();
    if (!keys.length) return;
    openModal({
      title: title || '设置群名称',
      bodyHtml: '给已勾选的 <b class="n">' + keys.length + '</b> 条数据填一个群名。' +
        '<div class="muted" style="margin-top:8px">填完它们就变成「已分配」。留空直接确定 = 清空群名，退回「未分配」。</div>',
      input: { placeholder: '输入群名（留空 = 清空群名）' },
      okText: '确定',
      allowEmpty: true,                 // ⚠️ 必须允许空输入 —— 「清空群名」就是靠空值走的
      onOk: function (v) {
        var name = (v || '').trim();
        if (name) { applyGroup(name, keys); return; }
        var has = false;
        keys.forEach(function (k) { var r = findRow(k); if (r && r.group) has = true; });
        if (!has) { toast('勾选的这些本来就没有群名'); return; }
        clearGroup(keys);
      }
    });
  }
  // ② 设为已拉：只弹一个提醒窗（真正干活的还是 markLaunched —— 跳过非「已分配」、报数、撤销都归它）
  function batchSetLaunched(title) {
    var keys = batchKeysOrHint();
    if (!keys.length) return;
    var nPend = 0;
    keys.forEach(function (k) { var r = findRow(k); if (r && r.status === 'pending') nPend++; });
    if (!nPend) { toast('勾选的里没有「已分配」的数据 —— 先用「设置群名称」填上群名，它们才会变成「已分配」'); return; }
    var nOther = keys.length - nPend;
    openModal({
      title: title || '设为已拉群',
      bodyHtml: '把 <b class="n">' + nPend + '</b> 条「已分配」的数据设为「<b>已拉群</b>」。' +
        '<div class="muted" style="margin-top:8px">只有「已拉群」的数据能用「导出表格」导出。' +
        (nOther ? '另外 ' + nOther + ' 条不是「已分配」，会自动跳过。' : '') + '</div>',
      okText: '确定',
      onOk: function () { markLaunched(); }
    });
  }
  // ③ 设为未分配：**清空群名 + 退回「未分配」**（「已完成」不动，会数出来告诉用户）。带 6 秒撤销。
  //    会丢掉群名 → 先弹个红色确认窗（比"直接执行"稳），撤销按钮还在提示条上兜底。
  function batchSetUnassign(title) {
    var keys = batchKeysOrHint();
    if (!keys.length) return;
    var n = 0, nDone = 0;
    keys.forEach(function (k) {
      var r = findRow(k);
      if (!r) return;
      if (r.status === 'done') { nDone++; return; }
      if (r.status === 'none' && !r.group) return;   // 本来就是未分配，不算
      n++;
    });
    if (!n) { toast(nDone ? ('勾选的 ' + nDone + ' 条是「已完成」的 —— 先「设为已拉群」恢复，再设未分配') : '勾选的这些本来就是「未分配」'); return; }
    openModal({
      title: title || '设为未分配',
      bodyHtml: '把 <b class="n">' + n + '</b> 条数据设为「<b>未分配</b>」。' +
        '<div class="muted" style="margin-top:8px">它们身上的<b>群名会被清掉</b>，回到「未分配」。' +
        (nDone ? '另外 ' + nDone + ' 条是「已完成」，会自动跳过。' : '') + '</div>',
      okText: '确定', okRed: true,
      onOk: function () { setUnassign(keys); }
    });
  }
  // ④ 设为已分配：**群名原样保留**，状态退回「已分配」（没有群名的跳过 —— 「已分配」= 有群名）。
  //    轻量、可逆 → 不弹窗，直接执行 + 6 秒撤销。
  function batchSetAssigned() {
    var keys = batchKeysOrHint();
    if (!keys.length) return;
    setAssigned(keys);
  }
  // ⚠️ 2026-10-14 牛牛要求：整条「设为已完成」链路已删除（原来的 batchSetDone + setDone）——
  //    「已完成」只由「导出表格」导出「已拉群」时自动产生，不再留手动入口。
  // 按 key 批量删行：带 6 秒撤销，撤销时按**原来的索引位置**插回（而不是一股脑堆到末尾）
  function deleteRowsByKeys(keys) {
    var inKeys = {}; keys.forEach(function (k) { inKeys[k] = true; });
    var snap = [];
    rows.forEach(function (r, i) { if (inKeys[r.k]) snap.push({ i: i, r: r }); });
    if (!snap.length) { toast('没有可删除的数据'); return; }
    // ⚠️ 2026-10-15 牛牛定调：**手动删除不留数据ID**（只有"导出后自动归档"才留）→
    //    同样的数据下次导入还会被当成新数据加进来。只在删到「已完成」时提一句，免得删未分配也啰嗦。
    var doneN = snap.filter(function (s) { return s.r.status === 'done'; }).length;
    rows = rows.filter(function (r) { return !inKeys[r.k]; });
    selected = {};
    save(); render();
    toast('已删除 ' + snap.length + ' 条数据' +
      (doneN ? '。⚠️ 这批的ID没留存，下次导入还会进来' : ''), function () {
      snap.slice().sort(function (a, b) { return a.i - b.i; }).forEach(function (s) { rows.splice(s.i, 0, s.r); });
      save(); render(); toast('已撤销删除');
    });
  }
  // 「标记已拉群」（2026-10-12 新增）：把**勾选里状态为「已分配」的**批量推进到「已拉群」。
  //   流程：未分配 → 已分配 → 已拉群 →（导出表格）→ 已完成
  //   · 其它状态（未分配 / 已完成 / 不在库）一律跳过，并数出来告诉用户
  //   · 带撤销（6 秒），和别处一致
  function markLaunched() {
    var keys = Object.keys(selected).filter(function (kk) { return selected[kk]; });
    if (!keys.length) { toast('还没勾选数据 —— 先在每行前面打个勾，或用「数据类型 + 选中 N」批量选'); return; }
    var hit = [], nSkip = 0;
    keys.forEach(function (k) {
      var r = findRow(k);
      if (r && r.status === 'pending') hit.push(r); else nSkip++;
    });
    if (!hit.length) { toast('勾选的里没有「已分配」的数据 —— 「已拉群」得先有群名，用「设置群名称」填上'); return; }
    hit.forEach(function (r) { r.status = 'launched'; });
    selected = {};
    save(); render();
    var msg = '已把 ' + hit.length + ' 条标记为「已拉群」';
    if (nSkip) msg += '（另有 ' + nSkip + ' 条不是「已分配」，已跳过）';
    // ⚠️ 2026-10-14：撤销只保留「删除」类 —— 标记已拉群不再挂撤销
    toast(msg);
  }
  // 「恢复」：把**勾选的「已完成」行**退回「已拉群」（群名原样保留）。
  //   · 只有已完成的行会被动到，其他行一律不管（也不会误伤）
  //   · 万一条目没有群名 → 退回「未分配」而不是「已拉群」，否则会出现「已拉群但没有群名」的自相矛盾状态
  //   · 恢复完把勾选清掉（它们已经换到上面「进行中」区了，留着勾选容易误操作）
  function restoreDone() {
    var keys = Object.keys(selected).filter(function (kk) { return selected[kk]; });
    if (!keys.length) { toast('还没勾选数据 —— 已完成的行要先在下面展开折叠区，才勾得到'); return; }
    var inKeys = {}; keys.forEach(function (x) { inKeys[x] = true; });
    var n = 0, nPend = 0, nNone = 0;
    rows.forEach(function (r) {
      if (!inKeys[r.k] || r.status !== 'done') return;
      // 有群名 → 退回「已拉群」（导出前的最后一个状态，也是导出表格的数据来源）；
      // 没群名（从"导出未分配"直接标完成的）→ 退回「未分配」
      if (r.group) { r.status = 'launched'; nPend++; } else { r.status = 'none'; nNone++; }
      delete r.doneAt;                                             // 退回就不再是「已完成」，时间戳一并清掉
      n++;
    });
    if (!n) { toast('勾选的里没有「已完成」的 —— 已完成的行要先展开折叠区，才勾得到'); return; }
    keys.forEach(function (x) { delete selected[x]; });
    save(); render();
    var msg = '已恢复 ' + n + ' 条';
    if (nPend) msg += '为「已拉群」';
    if (nNone) msg += (nPend ? '，另有 ' : '') + nNone + ' 条没有群名，退回「未分配」';
    // ⚠️ 2026-10-14：撤销只保留「删除」类 —— 退回已拉群不再挂撤销
    toast(msg);
  }

  // 「设为未分配」的干活函数（操作栏「修改类型 → 设为未分配」）：清空群名 + 状态退回 none。
  //   · 「已完成」不动（要先「设为已拉群」恢复）
  //   · 本来就是「未分配且没群名」的不算改动（避免报"已把 3 条设为未分配"其实一条没动）
  function setUnassign(keys) {
    var inKeys = {}; keys.forEach(function (x) { inKeys[x] = true; });
    var n = 0, nDone = 0;
    rows.forEach(function (r) {
      if (!inKeys[r.k]) return;
      if (r.status === 'done') { nDone++; return; }
      if (r.status === 'none' && !r.group) return;
      r.group = ''; r.status = 'none'; n++;
    });
    selected = {};                       // 不管有没有改到，都退出当前选择状态
    if (!n) {
      render();
      toast(nDone ? ('勾选的 ' + nDone + ' 条是「已完成」的 —— 先「设为已拉群」恢复') : '勾选的这些本来就是「未分配」');
      return;
    }
    save(); render();
    // ⚠️ 2026-10-14：撤销只保留「删除」类 —— 设为未分配不再挂撤销
    toast('已把 ' + n + ' 条设为「未分配」' + (nDone ? '（另有 ' + nDone + ' 条已完成被跳过）' : ''));
  }
  // 「设为已分配」的干活函数：**群名原样保留**，状态退回 pending。
  //   ⚠️ 「已分配」的定义就是"已经分好群了" → **没有群名的行当不成「已分配」**，跳过并报数（让用户先去「设置群名称」）。
  function setAssigned(keys) {
    var inKeys = {}; keys.forEach(function (x) { inKeys[x] = true; });
    var n = 0, nNoGrp = 0, nDone = 0;
    rows.forEach(function (r) {
      if (!inKeys[r.k]) return;
      if (r.status === 'done') { nDone++; return; }
      if (r.status === 'pending') return;                 // 已经是「已分配」
      if (!r.group) { nNoGrp++; return; }                 // 没群名 → 当不成「已分配」
      r.status = 'pending'; n++;
    });
    selected = {};
    if (!n) {
      render();
      toast(nDone ? ('勾选的 ' + nDone + ' 条是「已完成」的 —— 先「设为已拉群」恢复')
                  : (nNoGrp ? '勾选的这些还没群名 —— 先用「设置群名称」填上，才会进「已分配」'
                            : '勾选的这些已经是「已分配」了'));
      return;
    }
    save(); render();
    var msg = '已把 ' + n + ' 条设为「已分配」';
    var skip = [];
    if (nNoGrp) skip.push(nNoGrp + ' 条没群名');
    if (nDone) skip.push(nDone + ' 条已完成');
    if (skip.length) msg += '（' + skip.join('、') + ' 已跳过）';
    // ⚠️ 2026-10-14：撤销只保留「删除」类 —— 设为已分配不再挂撤销
    toast(msg);
  }
  // ==================== 搜索定位（只服务仪表盘的大搜索框，不动任何数据） ====================
  // ⚠️ 数据页那个定位框已删除；locateFind / locateGo 被仪表盘的 dashGo2 复用，必须留着。
  // 规则：**只搜 数据昵称 / 数据ID**，**包含匹配**（打 1588 能命中 1588559962），忽略大小写。
  //   ⚠️ 按用户要求**不再匹配「群名称」** —— 让行为和输入框提示语完全一致，免得搜了没反应还纳闷。
  // 范围：**所有设备**（搜到别人设备里的人，点一下会自动切过去）。
  // 顺序：按侧栏设备顺序 + 表内顺序 —— 和用户看到的顺序一致。
  function locateFind(q) {
    q = String(q || '').trim().toLowerCase();
    if (!q) return [];
    var ord = {};
    deviceOrder.forEach(function (d, i) { ord[d] = i; });
    var out = rows.filter(function (r) {
      return String(r.nick || '').toLowerCase().indexOf(q) !== -1 ||
             String(r.id || '').toLowerCase().indexOf(q) !== -1;
    });
    // Array.sort 在现代 V8 里是稳定的 → 同设备内保持原顺序
    return out.sort(function (a, b) {
      var ia = (a.device in ord) ? ord[a.device] : 1e9;
      var ib = (b.device in ord) ? ord[b.device] : 1e9;
      return ia - ib;
    });
  }
  var LOC_MAX = 3;            // 列表最多显示 3 条
  // ⚠️ 数据页的「搜索定位框」已按用户要求删除，所以只服务 #locList 的
  //    locateRender / locateMove 也一并删掉了（仪表盘的大搜索走 dashLocRender / dashLocMove）。
  //    这里只留一个「清空定位词」的动作，给 locateGo 和"切设备"用。
  function locateClose() {
    locateQ = '';
    locateIdx = 0;
  }
  // 点某一条 → 跳过去
  function locateGo(k) {
    var r = findRow(k);
    locateClose();                     // 先关列表 + 清空输入（下面 render 会按空值重建）
    if (!r) { render(); return; }
    var dev = r.device;
    if (dev !== filterDevice) {
      filterDevice = dev;              // 目标是别的设备 → 切过去
      selected = {};
    }
    // 目标在「已完成」折叠区里 → **自动展开**，否则跳过去也看不见那行（display:none）
    // ⚠️ 这句必须放在最后：切设备的默认行为是把已完成折叠起来，这里要覆盖它
    if (r.status === 'done') doneCollapsed[dev] = false;
    mainView = 'data';
    saveUI();
    render();
    var tr = document.querySelector('tr[data-k="' + k + '"]');
    if (tr) {
      tr.scrollIntoView({ block: 'center', behavior: 'smooth' });   // 居中：滚到底会被吸底操作栏挡住
      tr.classList.add('loc-hit');
      if (locHitTm) clearTimeout(locHitTm);
      locHitTm = setTimeout(function () { tr.classList.remove('loc-hit'); }, 3000);
    } else {
      toast('这条数据现在看不到 —— 可能被筛选或搜索条件挡住了');
    }
  }

  // （原 cancelPick 已删除 —— 它是旧「✕ 取消」按钮的处理函数，按钮去掉后就没有调用方了。）

  // 批量删除群名：勾选行里凡是「有群名且未完成」的，group 清空、status 退回 none。
  // 「已完成」的行不动（要退群名得先「恢复」），但会数出来告诉用户。
  function clearGroup(keys) {
    var inKeys = {}; keys.forEach(function (x) { inKeys[x] = true; });
    var n = 0, nSkip = 0;
    rows.forEach(function (r) {
      if (!inKeys[r.k]) return;
      if (r.status === 'done') { nSkip++; return; }     // 已完成不参与
      if (outOfLib(r) || !r.group) return;
      r.group = ''; r.status = 'none'; n++;
    });
    // ⚠️ 不管有没有删到东西，勾选都要清掉 —— 总得能退出当前选择状态。
    // （之前这里没删到东西就 return，导致按了没反应；这条一直保留。）
    selected = {};
    if (!n) {
      render();
      toast(nSkip ? ('勾选的 ' + nSkip + ' 条是「已完成」的 —— 先「恢复」才能退群名')
                  : '勾选的这些本来就没有群名');
      return;
    }
    save(); render();
    // ⚠️ 2026-10-14：撤销只保留「删除」类 —— 退群名不再挂撤销
    toast('已删除 ' + n + ' 条的群名，退回「未分配」' + (nSkip ? '（另有 ' + nSkip + ' 条已完成被跳过）' : ''));
  }

  // ---------- 事件委托 ----------
  document.addEventListener('click', function (e) {
    if (e.target.closest('input,select')) return;   // 输入框/复选框交给各自事件
    var t = e.target.closest('[data-act],.dev-item');
    if (!t) return;

    // ---- 操作栏自定义下拉（向上弹）：开 / 关（同时收起另一个）----
    if (t.getAttribute('data-act') === 'ddToggle') {
      var ddl = t.parentNode.querySelector('.vb-dd-list');
      var willOpen = ddl.hidden;
      ddCloseAll(ddl);
      ddl.hidden = !willOpen;
      t.classList.toggle('on', willOpen);
      return;
    }

    if (t.classList.contains('dev-item')) {
      var dv = t.getAttribute('data-dev');
      // ⚠️ 群视图下点设备**必须**退出群视图 —— 原来只比 filterDevice，
      //    在群视图里点"当前这台设备"时 changed=false，结果点了毫无反应（2026-10-12 实测发现）
      var changed = (filterDevice !== dv) || !!groupScope;
      var leavingPage = (mainView !== 'data');
      if (changed) {
        filterDevice = dv;
        groupScope = '';        // 点设备 = 退出群视图，回到按设备看
        selected = {};          // 切换设备时清空选中
        locateClose();          // 搜索定位框也清空（避免带着旧词换设备）
      }
      // 切换页/切换设备时，把目标设备的「已完成」折叠起来（保持列表清爽）
      if (changed || leavingPage) doneCollapsed[dv] = true;
      // 点设备名总是回到数据表（可能当前正停在导入/导出/库管理整页）
      if (changed || leavingPage) { mainView = 'data'; saveUI(); render(); }
      return;
    }

    var act = t.getAttribute('data-act'), dev = t.getAttribute('data-dev'), k = t.getAttribute('data-k');
    // ---- 操作栏自定义下拉的选项 / 侧栏「保持展开」固定键 ----
    if (act === 'pickType') { onPickType(t.getAttribute('data-v')); return; }
    if (act === 'batchPick') { ddCloseAll(); batchPick(t.getAttribute('data-v')); return; }
    if (act === 'togglePin') { sidebarPinned = !sidebarPinned; saveUI(); syncSidebar(); render(); return; }
    // ---- 侧栏底部的三个全局操作：改为主区整页视图（不再弹窗）----
    if (act === 'openImport') { pendingFiles = []; mainView = 'import'; render(); return; }
    // 侧栏标题右边的亮/暗切换（2026-10-15）
    if (act === 'toggleTheme') { setTheme(isDark() ? 'light' : 'dark'); return; }
    // 音效开关（2026-10-15）。⚠️ 关掉时也要响一声（否则按了像没反应）→ 传 force 绕过刚翻过去的开关。
    if (act === 'toggleSound') {
      SOUND = !SOUND;
      sfx(SOUND ? 'ok' : 'block', true);
      saveUI(); render(); return;
    }
    // ---- 导入页：移除单个文件 / 取消全部 / 确定导入 ----
    if (act === 'impRemove') { pendingFiles.splice(+t.getAttribute('data-i'), 1); render(); return; }
    if (act === 'impClear') { pendingFiles = []; render(); toast('已清空待导入列表'); return; }
    if (act === 'impGo') {
      if (!pendingFiles.length) { toast('还没有选择文件'); return; }
      var fs = pendingFiles.slice();       // 先拷一份：importFiles 是异步的
      pendingFiles = [];
      importFiles(fs);                     // importFiles 完成后会把 mainView 切回 data 并 render
      return;
    }
    if (act === 'openExport') { mainView = 'export'; render(); return; }
    if (act === 'openRoster') { mainView = 'roster'; render(); return; }
    // ---- 仪表盘 ----
    if (act === 'openDash') { mainView = 'dash'; render(); return; }
    if (act === 'dashGo') { dashGo2(t.getAttribute('data-k')); return; }
    // ---- 数据备份页：导出 / 选备份文件恢复 ----
    if (act === 'openBackup') { mainView = 'backup'; render(); return; }
    if (act === 'bkExport') { bkExport(); return; }
    if (act === 'bkPick') { var bf = $('backupFile'); if (bf) bf.click(); return; }
    if (act === 'openManage') { mainView = 'manage'; render(); return; }
    if (act === 'openAddDev') { newDevVal = ''; mainView = 'addDev'; render(); return; }
    if (act === 'addDevOk') { addDevOk(); return; }
    if (act === 'toggleDevList') {
      devListCollapsed = !devListCollapsed;
      if (!devListCollapsed) grpListCollapsed = true;   // 展开设备列表 → 收起群组列表（互斥，2026-10-13）
      saveUI(); render(); return;
    }
    if (act === 'doExport') { askExport(); return; }
    // 导出未分配：先弹确认框问「要不要顺手标成已完成」，再导
    if (act === 'askExportNone') { askExportNone(); return; }
    // ---- 管理设备整页：改名 / 删除（排序走拖拽，见下方 drag 委托）----
    if (act === 'renameDev') {
      var rd = t.getAttribute('data-dev');
      openModal({
        title: '修改设备名称',
        bodyHtml: '<div class="muted">给设备「' + esc(rd) + '」改一个新名称，该设备下的数据会一并跟着改。</div>',
        input: { placeholder: '新的设备名称', value: rd },
        okText: '保存',
        onOk: function (val) { renameDevice(rd, val); }
      });
      return;
    }
    if (act === 'delDev') {
      // 删除设备 = 连同其下数据 **+ 该设备的「已归档去重名单」** 一起永久删除。
      // ⚠️ 2026-10-15 起加了确认弹窗：以前是"点了就删、不弹提示条"，现在会**顺手清掉去重名单**
      //    （这是必须的 —— 否则他想重做这台设备时，重新导入会一条都进不来），
      //    既然多删了一样东西，至少得让他知道。

  // ==================== 仪表盘（velora 背景网格 + VanishInput 搜索框） ====================
  // 2026-10-13 重做：**统计栏整体砍掉**（原来那 5 个数字 + 悬停浮层）。
  // 背景照 velora-ui 的 Background Boxes、搜索框照 Vanish Input，都手写成纯 CSS/JS（零依赖），

  // ---- 背景：等距网格 ----
  var BG_CELL = 48;                       // 格子边长（原版 cellSize = 48）
  // 九种格子色 = 品牌三色 × 三档浓度，顺序和原版完全一致（85 → 65 → 45，每档 from / via / to）
  var BG_TINTS = [85, 65, 45].reduce(function (acc, p) {

  // 要多少格才能铺满？
  // 网格是「转 45°、再纵向压扁 58%」的正方形，覆盖范围是个菱形；要让菱形四个角都盖住容器，
  // 正方形边长 S 得满足 (W/2)·√2/S + (H/2)·√2/(0.58·S) ≤ 1  →  S ≥ 0.7071W + 1.219H
  // ⚠️ 原版默认 32×32 放进小 demo 容器够用；**铺满整页就不够了**（四角会露出菱形的斜边），
  //    所以这里按窗口实算，下限 32（原版）、上限 80 防止大屏上 DOM 爆炸。
  function bgSide() {
    // ⚠️ 2026-10-13：侧栏改成 rail（收起 64 / 悬停 232）→ **不能再写死 232**！
    //    写死会在侧栏收起时少算 168px，网格盖不满、四角露出斜边（回归测试抓到过）。
    //    直接量主区实际宽度最稳 —— 主区宽度**不随侧栏悬停变化**（展开走负 margin 覆盖，不挤压主区）。
    var mainEl = document.getElementById('main');
    var W = Math.max(320, mainEl ? mainEl.clientWidth : (window.innerWidth - 64));
    var H = Math.max(320, window.innerHeight);         // 右主区高（仪表盘撑满一屏）
    var need = 0.7071 * W + 1.219 * H + 2 * BG_CELL;   // 末尾 +2 格余量
    return Math.max(32, Math.min(Math.ceil(need / BG_CELL), 80));

  //   鼠标悬停在框上 / 输入框聚焦 / 系统开了「减弱动态效果」。
  var DV_PH = ['试试搜昵称', '试试搜 ID'];

  }

  function dvGhostSync() {
    var g = $('dashGhost'), i = $('dashSearch');

    if (g.textContent !== DV_PH[dvIdx]) g.textContent = DV_PH[dvIdx];

  // 唯一入口：该轮播就跑，不该跑就停（对应原版 useEffect 的依赖列表）
  function dvSync() {

  function dvStep() {

    g.classList.remove('enter');
    g.classList.add('out');                    // ① 上滑 8px + 淡出（250ms）
    setTimeout(function () {
      dvIdx = (dvIdx + 1) % DV_PH.length;
      g.textContent = DV_PH[dvIdx];
      g.classList.remove('out');
      g.classList.add('enter');                // ② 无过渡地先落到「下方 8px + 透明」
      void g.offsetWidth;                      //    同步强制重排，让浏览器认下这个起点

  // 仪表盘是整页重绘，所以每次渲染完都要重新接一次线

      doneCollapsed = (b.ui || {}).doneCollapsed || {};
      devListCollapsed = !!(b.ui || {}).devListCollapsed;
      if (!devListCollapsed) grpListCollapsed = true;   // 侧栏互斥不变量：设备列表展开 → 群组列表收起
      grpOrder = (Object.prototype.toString.call(b.grpOrder) === '[object Array]') ? b.grpOrder : [];
      usedIds = normalizeUsedIds(b.usedIds);     // ⚠️ 归档去重名单也要一起退回
      selected = {}; filterDevice = deviceOrder[0] || '';
      save(); render(); toast('已撤销恢复');
    });
  }

  // ---------- 导入弹窗里的那套已删除 ----------
  // 导入现在是「导入粉丝」整页：先把文件攒在列表里、可逐个 × 掉，点「确定导入」才真的导。
  // 见 importPageHtml / wireImportPage / addPendingFiles。

  // 弹窗：点遮罩关闭 + 按钮处理
  $('modalMask').addEventListener('click', function (e) {
    if (e.target === this) { closeModal(); return; }
    var b = e.target.closest('[data-modal]');
    if (!b) return;
    if (b.getAttribute('data-modal') === 'ok') confirmModal(); else closeModal();
  });
  // 弹窗键盘：Esc = 取消，回车 = 确定（无「确定」按钮的弹窗回车无效；输入型弹窗为空时不关闭）
  document.addEventListener('keydown', function (e) {
    if (!$('modalMask').classList.contains('show')) return;
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
    else if (e.key === 'Enter' && modalHasOk) { e.preventDefault(); confirmModal(); }
  });

  // ---------- 静态元素的事件 ----------
  // 只有这两个隐藏的文件选择框是静态的；侧栏那三个按钮和搜索框都在会被重绘的区域里，
  // 所以它们的事件写在上面的事件委托里（直接绑定第一次重绘后就会失效）。
  $('fileInput').addEventListener('change', function () {
    // 只把文件攒到导入页的列表里，等用户点「确定导入」才真的导
    if (this.files.length) { mainView = 'import'; addPendingFiles(this.files); }
    this.value = '';
  });
  $('rosterFile').addEventListener('change', function () {
    if (this.files.length) onRosterFileChosen(this.files);
    this.value = '';
  });
  $('backupFile').addEventListener('change', function () {
    if (this.files.length) onBackupFileChosen(this.files);
    this.value = '';
  });
  load();
  applyTheme();               // ⚠️ 按 load() 读出来的 THEME 同步一次 <html data-theme>
                              //    （首屏那段内联脚本已经打过了，这里是"两边对齐"的保险）
  render();
  initSidebarRail();          // 侧栏 rail：悬停 / 键盘聚焦自动展开（2026-10-13 第三轮）
  // 名单库：先读本机缓存立刻可用（断网也行），云端再在后台比对版本号
  initRoster().then(function () {
    if (rosterSet.size) render();                       // 缓存命中 → 立刻把红标补上
    else if (ROSTER_MODE === 'cloud') toast('正在获取云端名单库…');
    return cloudSync();
  }).then(function (r) {
    if (r && r.updated) {
      render();
      // 名单库是后台下载的，完成时间不可预测（几秒到几十秒）。
      // 如果此刻正有一条「撤销」提示挂着，千万别顶掉它 —— 用户可能正要按。
      // 这条只是通知性质，静默丢掉没有损失。
      if ($('toastUndo').hidden) toast('云端名单库已就绪：' + r.count.toLocaleString() + ' 条（用时 ' + r.ms + 'ms）');
    }
  }).catch(function () { /* 拉不到就静默用缓存，不打扰用户 */ });
})();
</script>
</body>
</html>
